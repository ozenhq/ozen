<!doctype html>
<!-- Places map: Leaflet + OpenStreetMap, free and OS-agnostic (any web view or browser).
     Host → map: show(places, radius, here, fit): places = [{label, lat, lon, action, radius}] where action is
     "record" | "meetings" | "off" and radius (meters) falls back to the radius argument; here = {lat, lon} or null;
     fit = zoom to the places. picking(on) switches the crosshair for "Pick on map".
     Map → host: {type: "move", index, lat, lon} when a pin is dragged, {type: "click", lat, lon} on a map click,
     sent to whichever bridge the host provides (WebKit, WebView2, or an embedding page via postMessage). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  .place { font: 600 12px -apple-system, system-ui, sans-serif; }
  .picking, .picking .leaflet-interactive { cursor: crosshair; }
  .pin { width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 3px #0006; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map("map").setView([20, 0], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const colors = { record: "#e5484d", meetings: "#f5a524", off: "#8b8d98" };

function send(msg) {
  if (window.webkit?.messageHandlers?.ozen) window.webkit.messageHandlers.ozen.postMessage(msg);  // macOS/iOS WebKit
  else if (window.chrome?.webview) window.chrome.webview.postMessage(msg);  // Windows WebView2
  else if (window.parent !== window) window.parent.postMessage({ ozen: msg }, "*");  // embedded in a page
}

map.on("click", (e) => send({ type: "click", lat: e.latlng.lat, lon: e.latlng.lng }));

function picking(on) { map.getContainer().classList.toggle("picking", on); }

function show(places, radius, here, fit = true) {
  layer.clearLayers();
  const bounds = [];
  places.forEach((p, index) => {
    if (p.lat == null || p.lon == null) return;  // a place not set yet has nothing to draw
    const color = colors[p.action] || colors.off;
    const at = [p.lat, p.lon];
    const circle = L.circle(at, { radius: p.radius || radius, color, weight: 1.5, fillOpacity: 0.15 }).addTo(layer);
    const icon = L.divIcon({ className: "", html: `<div class="pin" style="background:${color}"></div>`, iconSize: [18, 18] });
    L.marker(at, { icon, draggable: true })
      .bindTooltip(p.label, { permanent: true, direction: "top", offset: [0, -10], className: "place" })
      .on("drag", (e) => circle.setLatLng(e.target.getLatLng()))
      .on("dragend", (e) => { const c = e.target.getLatLng(); send({ type: "move", index, lat: c.lat, lon: c.lng }); })
      .addTo(layer);
    bounds.push(at);
  });
  if (here) {
    L.circleMarker([here.lat, here.lon], { radius: 6, color: "#fff", weight: 2, fillColor: "#0a84ff", fillOpacity: 1 })
      .bindTooltip("You", { direction: "top" }).addTo(layer);
    if (!bounds.length) bounds.push([here.lat, here.lon]);
  }
  if (fit && bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.5), { maxZoom: 16 });
}
</script>
</body>
</html>
