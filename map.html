<!doctype html>
<!-- Places map: Leaflet + OpenStreetMap, free and OS-agnostic (any web view or browser).
     The host calls show(places, radius, here): places = [{label, lat, lon, action: "record"|"off"}],
     radius in meters, here = {lat, lon} or null. Open it in a browser to see an empty map. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  .place { font: 600 12px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map("map").setView([20, 0], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const colors = { record: "#e5484d", off: "#8b8d98" };  // red records, gray turns recording off

function show(places, radius, here) {
  layer.clearLayers();
  const bounds = [];
  for (const p of places) {
    if (p.lat == null || p.lon == null) continue;  // a place not set yet has nothing to draw
    const color = colors[p.action] || colors.off;
    const at = [p.lat, p.lon];
    L.circle(at, { radius, color, weight: 1.5, fillOpacity: 0.15 }).addTo(layer);
    L.circleMarker(at, { radius: 7, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
      .bindTooltip(p.label, { permanent: true, direction: "top", offset: [0, -8], className: "place" })
      .addTo(layer);
    bounds.push(at);
  }
  if (here) {
    L.circleMarker([here.lat, here.lon], { radius: 6, color: "#fff", weight: 2, fillColor: "#0a84ff", fillOpacity: 1 })
      .bindTooltip("You", { direction: "top" }).addTo(layer);
    if (!bounds.length) bounds.push([here.lat, here.lon]);
  }
  if (bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.5), { maxZoom: 16 });
}
</script>
</body>
</html>
