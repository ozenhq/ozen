name: ci
# Runs on pull requests only. A squash merge lands code that already passed on its PR head, so re-running
# on every push to main billed a third of this private repo's macOS minutes (10x rate) for no new signal.
# Check main by hand from the Actions tab when needed.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # The recorder needs ScreenCaptureKit mic capture (macOS 15 SDK), and screencapturekit's Metal bridge
    # compiles against macOS 26 APIs, so build with the newest Xcode the image has.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Swift menu bar and icon type-check
        run: swiftc -typecheck menubar.swift && swiftc -typecheck icon.swift
      - name: Python scripts compile
        run: python3 -m py_compile transcribe.py train.py eval.py
