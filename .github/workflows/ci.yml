name: ci
# main once a day, plus manual runs (workflow_dispatch, any branch). Not on pull requests: their macOS runs (10x rate)
# hit this private repo's Actions limit. The daily run catches what lands on main, one run however many merges land.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed:
    # Linux, billed 1x: lets the daily run skip the macOS job when main has not moved since yesterday.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: c
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
  advisories:
    # Security advisories against any crate in the build (deny.toml); Linux, seconds. Not gated on `changed`:
    # advisories come out while main stands still.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
  check:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    # The recorder needs ScreenCaptureKit mic capture (macOS 15 SDK), and screencapturekit's Metal bridge
    # compiles against macOS 26 APIs, so build with the newest Xcode the image has.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      # every sync test that can run here; the #[ignore]d ones need a real network, Local Network access or a
      # real ozen folder, and their docs say how to run them by hand. .githooks/pre-push runs this set too.
      - run: cargo nextest run
      # OFE-70: sync's tie-breaks and hashes must not depend on serde_json's map type, which any dependency
      # could flip through Cargo feature unification; the CRDT, merge and sync tests run again with it flipped.
      # Golden frames pin the default build's wire JSON, so they stay out of this run.
      - run: >-
          cargo nextest run --features serde_json/preserve_order
          -E '(test(/^(crdt|merge|sync)::/) - test(/golden/)) | test(/^merging_two_macs/)'
  linecheck:
    # Per-file line limits from linecheck.yml; Linux, billed 1x, needs no macOS toolchain.
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/linecheck
          key: ${{ runner.os }}-linecheck-1.2.1
      - run: command -v linecheck || cargo install linecheck --version 1.2.1 --locked
      - run: linecheck .
