name: release
# A version tag (v1.2.3) on a commit in main: build the CLI and recorder, pack them with the sources ozen runs from
# (the Python transcriber, the Swift menu bar), and upload a DMG and a tarball to R2 under their version and as latest.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main, to check the tag is on it
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        # ozen/ holds the tagged sources plus target/release/{ozen,rec}: unpacked in ~ it is the ~/ozen checkout.
        # The DMG holds Ozen.app with that checkout inside (menubar.swift copies it to ~/ozen on launch), next to an
        # Applications link to drag it onto, on a drawn background (`ozen dmg`, src/dmg.rs). The volume icon is
        # icon.swift's installer variant (a drive), so the mounted DMG doesn't look like the app.
        # Signed ad hoc: not notarized, so the first open needs Open Anyway.
        run: |
          v="$GITHUB_REF_NAME"
          mkdir -p pkg/ozen/target/release dmg
          git archive HEAD | tar -x -C pkg/ozen
          cp target/release/ozen target/release/rec pkg/ozen/target/release/
          echo "$v" > pkg/ozen/.version
          tar -czf "ozen-$v-macos-arm64.tar.gz" -C pkg ozen
          target/release/ozen app
          cp -R ~/Applications/Ozen.app dmg/
          cp -R pkg/ozen dmg/Ozen.app/Contents/Resources/
          codesign --force --deep -s - dmg/Ozen.app
          swift icon.swift pkg installer
          target/release/ozen dmg dmg/Ozen.app pkg/Installer.icns "ozen-$v-macos-arm64.dmg"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required # R2 rejects some of the CLI's default checksums
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          for ext in dmg tar.gz; do
            name="ozen-$GITHUB_REF_NAME-macos-arm64.$ext"
            aws s3 cp "$name" "s3://$BUCKET/$name" --endpoint-url "$ENDPOINT"
            aws s3 cp "$name" "s3://$BUCKET/ozen-latest-macos-arm64.$ext" --endpoint-url "$ENDPOINT" \
              --cache-control "no-cache"
            echo "Download: $PUBLIC_URL/$name (latest: $PUBLIC_URL/ozen-latest-macos-arm64.$ext)" >> "$GITHUB_STEP_SUMMARY"
          done
