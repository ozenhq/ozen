[package]
name = "ozen"
version = "0.1.0"
edition = "2024"
default-run = "ozen"  # `cargo run -- app` (README) must not have to pick between ozen and rec
publish = false

[profile.release]
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hound = "3.5.1"
jiff = "0.2.37"
objc2 = "0.6"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
regex = "1.13.1"
serde_json = "1.0.151"
signal-hook = "0.4.4"
similar = "3.2.0"
strsim = "0.11.1"
